<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Fallback tags only. The server rewrites the title and description per
         route from server/src/seo-meta.js, so these must stay in step with the
         default entry there: dev, and any route the prerender misses, serve
         this file verbatim. Keep both on one line — the rewrite is a regex. -->
    <meta name="description" content="Manual documentation drains engineering hours every release and delays shipping. Docify connects GitHub, GitLab, or Bitbucket read-only, updates the affected docs on merge, gates quality before publish, keeps a human approving every change, and exports to Markdown, PDF, Word, HTML, and DITA." />
    <meta name="theme-color" content="#0f62fe" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:image" content="https://docifydocai.com/og-image.png" />
    <meta name="twitter:image" content="https://docifydocai.com/og-image.png" />
    <title>Docify — Automated Technical Documentation from GitHub, GitLab &amp; Bitbucket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- ============ ANALYTICS ============ -->
    <!-- Google Analytics 4 — property "Docify - docifydocai.com" -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NQC5YKYCMF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      // send_page_view:false because this is a single-page app — pageviews are sent
      // manually on every route change from src/analytics.js (avoids miscounting).
      gtag('config', 'G-NQC5YKYCMF', { send_page_view: false });
    </script>

    <!-- Microsoft Clarity — project "Docify website" -->
    <!-- Records heatmaps and session replays. It loads on PUBLIC MARKETING
         ROUTES ONLY: the authenticated app renders customer source and
         documentation on screen, which must never be captured by a replay
         vendor. main.jsx additionally stops Clarity if the user navigates
         from a marketing page into the app. -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        var appRoutes = /^\/(dashboard|source|doctype|format|generate|quality|export|checkout|settings|automation|sync|repos|standardize|history|founder|oauth)/;
        if (appRoutes.test(l.location.pathname)) return;
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xja1tjpafu");
    </script>
    <!-- ============ /ANALYTICS ============ -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
